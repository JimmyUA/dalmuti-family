name: Game CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Game tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test game rules, strategy and reliability scenarios
        run: node tests/strategy.mjs

      - name: Build production application
        run: pnpm build
