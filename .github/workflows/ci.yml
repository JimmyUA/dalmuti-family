name: Game CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Game tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test game rules, strategy and reliability scenarios
        run: node tests/strategy.mjs

      - name: Test reconnects and retry-safe actions
        run: node tests/reliability.mjs

      - name: Build production application
        run: pnpm build
      - name: Deploy production from main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret before enabling deployment."
            exit 1
          fi
          node scripts/prepare-cloudflare-deploy.mjs
          pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/github-deploy.json
          pnpm exec wrangler deploy --config dist/server/github-deploy.json | tee /tmp/dalmuti-deploy.log
          node scripts/smoke-check.mjs /tmp/dalmuti-deploy.log

