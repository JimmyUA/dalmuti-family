name: Game CI

# CI is strictly read-only against Cloudflare. See docs/PHASE_0.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ format('game-ci-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Game tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce check-only CI and preserve recovery workflow
        run: node tests/pipeline-safety.mjs

      - name: Test environment isolation and staging guards
        run: node tests/deployment-isolation.mjs

      - name: Test release provenance and promotion safeguards
        run: node tests/release-pipeline.mjs

      - name: Test game rules, strategy and reliability scenarios
        run: |
          node tests/strategy.mjs
          node tests/table-events.mjs
          node tests/growth-analytics.mjs
          node tests/invite-sharing.mjs

      - name: Test legacy room compatibility and Phase 3 staging safeguards
        run: |
          node tests/room-compatibility.mjs
          node tests/phase3-safety.mjs
          node tests/staging-recovery.mjs
          node --check tests/staging-browser.mjs
          node --check tests/staging-api-e2e.mjs

      - name: Test reconnects and retry-safe actions
        run: node tests/reliability.mjs

      - name: Test production recovery guards
        run: node tests/recovery.mjs

      - name: Build production application
        run: pnpm build:production
      - name: Test production Worker routing
        run: node tests/production.mjs

      - name: Package immutable application artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/release-bundle.mjs pack "$GITHUB_SHA"

      - name: Upload tested commit artifact for staging and production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: crownturn-build
          path: |
            release/crownturn-build.tar.gz
            release/manifest.json
          retention-days: 30
          if-no-files-found: error
