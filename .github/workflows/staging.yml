name: Staging deployment (manual bootstrap)

# Phase 1: opt-in bootstrap only. Phase 2 will wire successful main CI to staging.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crownturn-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy isolated staging Worker + D1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CROWNTURN_DEPLOY_TARGET: staging
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_STAGING_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_STAGING_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      ROOM_IDLE_TTL_HOURS: ${{ vars.ROOM_IDLE_TTL_HOURS }}
      ROOM_ACTIVE_TTL_HOURS: ${{ vars.ROOM_ACTIVE_TTL_HOURS }}
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify staging secret and binding configuration
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Configure CLOUDFLARE_STAGING_API_TOKEN in the staging GitHub environment."; exit 1; }
          test -n "$CLOUDFLARE_STAGING_D1_DATABASE_ID" || { echo "::error::Configure CLOUDFLARE_STAGING_D1_DATABASE_ID in the staging GitHub environment."; exit 1; }
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || { echo "::error::Production D1 UUID is required for safety comparison."; exit 1; }
      - name: Run CI, isolation and recovery tests
        run: |
          node tests/pipeline-safety.mjs
          node tests/deployment-isolation.mjs
          node tests/strategy.mjs
          node tests/table-events.mjs
          node tests/reliability.mjs
          node tests/recovery.mjs
      - name: Build release
        run: pnpm build:production
      - name: Verify production Worker routing
        run: node tests/production.mjs
      - name: Prepare staging-only deployment
        run: node scripts/prepare-cloudflare-deploy.mjs
      - name: Apply migrations ONLY to staging D1
        run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/staging-deploy.json
      - name: Deploy staging Worker and verify
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config dist/server/staging-deploy.json --tag "$GITHUB_SHA" | tee /tmp/crownturn-staging-deploy.log
          node scripts/smoke-check.mjs /tmp/crownturn-staging-deploy.log staging
