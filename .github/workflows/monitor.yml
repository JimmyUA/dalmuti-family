name: Crownturn synthetic health monitor

# Read-only smoke monitoring. No Cloudflare credentials and no game mutations.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crownturn-synthetic-monitor
  cancel-in-progress: false

jobs:
  health:
    name: Check live staging and production health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only monitoring checks
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check published endpoints
        run: node scripts/monitor-endpoints.mjs
