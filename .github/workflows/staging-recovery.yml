name: Staging recovery readiness (read only)

# Intentionally no restore option. This workflow cannot mutate any Worker or D1.
on:
  workflow_dispatch:
    inputs:
      current_version:
        description: Currently active staging Worker UUID (100% traffic)
        required: true
        type: string
      target_version:
        description: Previous known-good staging Worker UUID
        required: true
        type: string
      target_release:
        description: Full 40-character SHA tagged on the target staging version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crownturn-staging
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify staging version only (no restore)
        env:
          CURRENT_VERSION: ${{ inputs.current_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
          TARGET_RELEASE: ${{ inputs.target_release }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_STAGING_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_STAGING_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        run: node scripts/verify-staging-recovery.mjs
