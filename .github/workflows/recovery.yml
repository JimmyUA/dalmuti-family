name: Production recovery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify target or restore production (read docs/RECOVERY.md first)
        type: choice
        options: [verify, restore]
        default: verify
        required: true
      current_version:
        description: Currently active Cloudflare version UUID
        required: true
        type: string
      target_version:
        description: Known-working Cloudflare version UUID
        required: true
        type: string
      target_release:
        description: Full 40-character Git commit SHA tagged on target version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: crownturn-production
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify or restore existing production version
        env:
          RECOVERY_MODE: ${{ inputs.mode }}
          CURRENT_VERSION: ${{ inputs.current_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
          TARGET_RELEASE: ${{ inputs.target_release }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/recover-production.mjs
